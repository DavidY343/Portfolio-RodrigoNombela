name: Trigger Vercel Rebuild

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Daily rebuild to fetch latest Behance projects
  workflow_dispatch:

jobs:
  deploy-vercel:
    name: Trigger Vercel Rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel Deploy Hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "Error: VERCEL_DEPLOY_HOOK secret is not set."
            exit 1
          fi
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
